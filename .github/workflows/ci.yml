name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: busirag
          POSTGRES_USER: busirag
          POSTGRES_PASSWORD: busirag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U busirag -d busirag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://busirag:busirag@localhost:5432/busirag

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install project
        run: |
          pip install --no-deps .

      - name: Enable pgvector
        run: |
          PGPASSWORD=busirag psql \
            -h localhost \
            -U busirag \
            -d busirag \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest -m "not integration"

  docker-build:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t busirag-api .