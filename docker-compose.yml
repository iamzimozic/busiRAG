services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: busirag
      POSTGRES_USER: busirag
      POSTGRES_PASSWORD: busirag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busirag -d busirag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://busirag:busirag@postgres:5432/busirag
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 60s

  ingestion:
      build:
        context: .
        dockerfile: Dockerfile
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql+psycopg://busirag:busirag@postgres:5432/busirag
        REDIS_URL: redis://redis:6379/0
      volumes:
        - ./data/raw:/app/data/raw:ro
        - ./scripts:/app/scripts:ro
      depends_on:
        postgres:
          condition: service_healthy
      command: ["tail", "-f", "/dev/null"]

  migrate:
        build:
          context: .
          dockerfile: Dockerfile
        env_file:
          - .env
        environment:
          DATABASE_URL: postgresql+psycopg://busirag:busirag@postgres:5432/busirag
        depends_on:
          postgres:
            condition: service_healthy
        command: ["alembic", "upgrade", "head"]

volumes:
  postgres_data:
  redis_data:
